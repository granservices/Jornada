name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://jornada:jornada@localhost:55432/jornada?schema=public
      REDIS_URL: redis://localhost:56379

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jornada
          POSTGRES_USER: jornada
          POSTGRES_PASSWORD: jornada
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U jornada -d jornada"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check critical dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Verify build and tests
        run: npm run check
