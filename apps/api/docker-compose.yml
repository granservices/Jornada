services:
  jornada-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jornada-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3004
      WEBHOOK_STORAGE_DIR: /app/data/webhooks
    ports:
      - "3004:3004"
    volumes:
      - ./data/webhooks:/app/data/webhooks
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3004/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
