services:
  jornada-intake-api:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    container_name: jornada-intake-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3014
      INTAKE_STORAGE_DIR: /app/data/raw-events
      INTAKE_SQLITE_PATH: /app/data/intake.sqlite
    ports:
      - "127.0.0.1:3014:3014"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3014/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
